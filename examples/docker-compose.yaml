services:
  nats:
    image: nats:2.10-alpine
    container_name: speedboat-nats
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/nats/nats.conf"
    ports:
      - "4222:4222"                # Native TCP client port
      - "8222:8222"                # HTTP management / monitoring
      - "8080:8080"                # WebSocket port for nats.ws browser clients
    volumes:
      - nats_data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro

  registry:
    image: registry:2
    container_name: speedboat-registry
    restart: unless-stopped
    ports:
      - "5000:5000"                # Docker Registry HTTP endpoint
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry

volumes:
  nats_data:
  registry_data: